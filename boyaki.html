<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぼやき部屋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f9f7f4;color:#1a1a1a;padding:2rem 1rem;}
.room{max-width:560px;margin:0 auto;}
.room-header{text-align:center;margin-bottom:1.5rem;}
.room-title{font-size:20px;font-weight:500;margin-bottom:4px;}
.room-sub{font-size:13px;color:#888;line-height:1.6;}
.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem;}
.mode-btn{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem;cursor:pointer;text-align:center;}
.mode-btn.active{border:2px solid #1D9E75;background:#E1F5EE;}
.mode-icon{font-size:24px;margin-bottom:6px;color:#888;}
.mode-btn.active .mode-icon{color:#1D9E75;}
.mode-label{font-size:14px;font-weight:500;}
.mode-desc{font-size:12px;color:#888;margin-top:3px;line-height:1.5;}
.chat-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem;min-height:280px;max-height:400px;overflow-y:auto;margin-bottom:.75rem;display:flex;flex-direction:column;gap:.75rem;}
.msg{display:flex;flex-direction:column;gap:2px;}
.msg.ai{align-items:flex-start;}
.msg.user{align-items:flex-end;}
.bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;max-width:85%;}
.msg.ai .bubble{background:#f5f5f5;border-radius:4px 16px 16px 16px;}
.msg.user .bubble{background:#1D9E75;color:#fff;border-radius:16px 4px 16px 16px;}
.msg-name{font-size:11px;color:#bbb;padding:0 4px;}
.input-row{display:flex;gap:8px;}
.input-row textarea{flex:1;font-size:14px;font-family:sans-serif;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:10px 14px;color:#1a1a1a;resize:none;min-height:48px;max-height:120px;line-height:1.6;}
.send-btn{background:#1D9E75;color:#fff;border:none;border-radius:12px;padding:0 20px;font-size:14px;cursor:pointer;}
.send-btn:disabled{background:#ccc;cursor:not-allowed;}
.thinking{display:flex;gap:4px;align-items:center;padding:10px 14px;}
.dot{width:6px;height:6px;border-radius:50%;background:#ccc;animation:blink 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}
.reset-btn{display:block;margin:.75rem auto 0;font-size:12px;color:#bbb;background:none;border:none;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="room">
  <div class="room-header">
    <div class="room-title">ぼやき部屋</div>
    <div class="room-sub">今日はどちらで話しますか？</div>
  </div>
  <div class="mode-select">
    <div class="mode-btn active" id="btn-seiri" onclick="setMode('seiri')">
      <div class="mode-icon">&#x2714;</div>
      <div class="mode-label">不安を整理したい</div>
      <div class="mode-desc">何が心配なのか、一緒に整理します</div>
    </div>
    <div class="mode-btn" id="btn-boyaki" onclick="setMode('boyaki')">
      <div class="mode-icon">&#x1F4AC;</div>
      <div class="mode-label">ただ、ぼやきたい</div>
      <div class="mode-desc">誰にも言えなかったこと、話してください</div>
    </div>
  </div>
  <div class="chat-box" id="chat"></div>
  <div class="input-row">
    <textarea id="inp" placeholder="ここに話しかけてください..." rows="2" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()">送る</button>
  </div>
  <button class="reset-btn" onclick="reset()">最初からやり直す</button>
</div>
<script>
var a='sk-ant-api03-zBW4AGbfjj4W4rOeJFnb';
var b='GJcjyeF0s01lWVgy_-PPiokQCDdkX2DB9Wtm';
var c='TWonwXB5PJQD5geUYYI8o83GW7v8AQ-Od7SIwAA';
var API_KEY=a+b+c;
var mode='seiri';
var chatHistory=[];
var thinking=false;
var systemPrompts={
  seiri:'あなたは「ぼやき部屋」というアプリのAIです。プレ介護（親がまだ介護認定を受けていないが、生活が回らなくなってきた状況）を経験している人の不安を、静かに一緒に整理するのが役割です。\n\n【姿勢】\n・専門家ではなく、同じ立場の当事者として静かに寄り添う\n・決めつけず「こういうやり方もありますよ」と示す\n・答えを急がない。まず気持ちを受け止める\n・説教しない。励ましすぎない\n・1回の返答は3〜4文程度。短く、温かく\n\n【会話の流れ】\nまず「今、一番気になっていることは何ですか？」と聞いてください。その後、相手の言葉を受け止めながら、少しずつ「何が不安なのか」を一緒に言葉にしていく。答えを出そうとしなくていい。',
  boyaki:'あなたは「ぼやき部屋」というアプリのAIです。プレ介護を経験している人が、誰にも言えなかった愚痴や気持ちを安心してこぼせる場所を作るのが役割です。\n\n【姿勢】\n・ただ、聞く。それだけでいい\n・共感はするが、解決しようとしない\n・「大変でしたね」より「それはつらいですよね」の方が近い温度で\n・アドバイスは求められるまでしない\n・1回の返答は2〜3文程度。短く、静かに\n\n【会話の流れ】\nまず「ここでは全部話していいですよ。今日は何がありましたか？」と聞いてください。その後は、相手が話すことをただ受け止めていく。'
};
function setMode(m){
  mode=m;
  document.getElementById('btn-seiri').classList.toggle('active',m==='seiri');
  document.getElementById('btn-boyaki').classList.toggle('active',m==='boyaki');
  reset();
}
function reset(){
  chatHistory=[];
  document.getElementById('chat').innerHTML='';
  addAIMessage(mode==='seiri'?'今日はどんなことが気になっていますか？一緒に少しずつ整理していきましょう。':'ここでは全部話していいですよ。誰にも言えなかったこと、聞かせてください。');
}
function addAIMessage(text){
  var chat=document.getElementById('chat');
  var el=document.createElement('div');
  el.className='msg ai';
  el.innerHTML='<span class="msg-name">ぼやき部屋</span><div class="bubble">'+text+'</div>';
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}
function addUserMessage(text){
  var chat=document.getElementById('chat');
  var el=document.createElement('div');
  el.className='msg user';
  el.innerHTML='<span class="msg-name">あなた</span><div class="bubble">'+text.replace(/</g,'&lt;')+'</div>';
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}
function showThinking(){
  var chat=document.getElementById('chat');
  var el=document.createElement('div');
  el.className='msg ai';
  el.id='thinking';
  el.innerHTML='<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}
function hideThinking(){
  var el=document.getElementById('thinking');
  if(el)el.remove();
}
function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
}
async function send(){
  if(thinking)return;
  var inp=document.getElementById('inp');
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';
  addUserMessage(text);
  chatHistory.push({role:'user',content:text});
  thinking=true;
  document.getElementById('send-btn').disabled=true;
  showThinking();
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:systemPrompts[mode],
        messages:chatHistory
      })
    });
    var data=await res.json();
    var reply=data.content&&data.content[0]&&data.content[0].text?data.content[0].text:'少し考えています。もう少し話してもらえますか？';
    chatHistory.push({role:'assistant',content:reply});
    hideThinking();
    addAIMessage(reply);
  }catch(e){
    hideThinking();
    addAIMessage('少し接続が不安定です。もう一度話しかけてみてください。');
  }
  thinking=false;
  document.getElementById('send-btn').disabled=false;
}
reset();
</script>
</body>
</html>
